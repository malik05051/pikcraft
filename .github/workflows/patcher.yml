name: Pikmin 1 patcher

on:
  push:
    branches: ["**"]
    paths: ["pikmin1/**", ".github/workflows/patcher.yml"]
  pull_request:
    paths: ["pikmin1/**", ".github/workflows/patcher.yml"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub release with this tag (e.g. v1.0.0); leave empty to only build"
        required: false
        default: ""
      delete_other_releases:
        description: "Delete every other release (and its tag) before publishing"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            name: pikcraft-patcher-linux-x86_64
          - os: windows-latest
            name: pikcraft-patcher-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: pikmin1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -t .
      - name: Build single-file executable
        run: |
          pip install pyinstaller==6.11.1
          pyinstaller --onefile --console --name ${{ matrix.name }} --add-data "pikcraft_patcher/data:pikcraft_patcher/data" pikcraft-patcher.py
      - name: Smoke test (the block-breaking code patch is bundled)
        shell: bash
        run: ./dist/${{ matrix.name }} --version | tee version.txt && grep -q GPIP01_00 version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: pikmin1/dist/${{ matrix.name }}

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Delete other releases
        if: inputs.delete_other_releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEEP: ${{ inputs.release_tag }}
        run: |
          gh release list --limit 200 --json tagName --jq '.[].tagName' | while read -r tag; do
            echo "Deleting release $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done
          # A stale tag with the new release's name would pin it to an old commit.
          gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$KEEP" 2>/dev/null || true
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: PikCraft ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          make_latest: true
          body: |
            **PikCraft: Minecraft-style block worlds inside the real Pikmin 1 (GameCube), played in [Dolphin](https://dolphin-emu.org).**

            The patcher turns your own Pikmin disc image into PikCraft: every area's terrain is rebuilt as grass, dirt, stone, sand, planks, mud and water blocks. Enemies, ship parts and carrying routes are unchanged, so the game plays as normal.

            **Break and place blocks** (PAL disc, GPIP01): aim the cursor and press **D-pad ◀** to break the block under it, **D-pad ▶** to place one. Olimar and the Pikmin walk into the holes you dig and onto what you build. The terrain resets each day.
            Other versions get the block terrain without breaking.

            ### How to use
            1. Download the patcher for your system below.
            2. Run it with your disc image and an output name, or run it with no arguments and it asks for both:
               - Windows: `pikcraft-patcher-windows-x86_64.exe "Pikmin.iso" "PikCraft.iso"`
               - Linux: `chmod +x pikcraft-patcher-linux-x86_64 && ./pikcraft-patcher-linux-x86_64 "Pikmin.iso" "PikCraft.iso"`
            3. Open `PikCraft.iso` in Dolphin.

            Supported: NTSC-U (GPIE01), NTSC-J (GPIJ01) and PAL (GPIP01). Use a plain `.iso`/`.gcm`; to convert an `.rvz`, right-click it in Dolphin, choose **Convert File…** and pick **ISO**. Your original image is never modified.

            No Nintendo or Mojang files are included: the patcher only rewrites the disc you supply, and the block textures are original pixel art.

            ---

            ### En français

            **PikCraft : des mondes en blocs façon Minecraft dans le vrai Pikmin 1 (GameCube), à jouer dans [Dolphin](https://fr.dolphin-emu.org).**

            Le patcher transforme votre propre image disque de Pikmin en PikCraft : le terrain de chaque zone est reconstruit en blocs d'herbe, de terre, de pierre, de sable, de planches, de boue et d'eau. Les ennemis, les pièces du vaisseau et les trajets de transport ne changent pas : le jeu se joue normalement.

            **Casser et poser des blocs** (disque PAL, GPIP01) : visez avec le curseur, **croix ◀** casse le bloc, **croix ▶** en pose un. Olimar et les Pikmin descendent dans les trous et montent sur ce que vous construisez. Le terrain revient à son état d'origine chaque jour. Les autres versions ont le terrain en blocs, sans cassage.

            1. Téléchargez le patcher pour votre système ci-dessous.
            2. Lancez-le avec votre image disque et un nom de sortie (ou sans arguments, il vous les demande) :
               - Windows : `pikcraft-patcher-windows-x86_64.exe "Pikmin.iso" "PikCraft.iso"`
               - Linux : `chmod +x pikcraft-patcher-linux-x86_64 && ./pikcraft-patcher-linux-x86_64 "Pikmin.iso" "PikCraft.iso"`
            3. Ouvrez `PikCraft.iso` dans Dolphin.

            Pour jouer en français : disque PAL, et **Config > GameCube > Langue du système : Français** dans Dolphin (ou **Options** sur l'écran titre du jeu). Le patcher parle français si votre système est en français (`--lang fr` pour le forcer).

            Aucun fichier de Nintendo ou de Mojang n'est inclus : le patcher ne fait que réécrire le disque que vous fournissez, et les textures des blocs sont du pixel art original.
