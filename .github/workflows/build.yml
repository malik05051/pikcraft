name: Build & Release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub release with this tag (e.g. v1.0.0); leave empty to only build"
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install ALSA headers and runtime libraries for the headless self-test
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev xvfb libgl1-mesa-dri libgl1 libx11-6 libxi6

      - name: Unit tests
        run: cargo test --release

      - name: Build
        run: cargo build --release

      # Non-blocking: shared runners can hit GitHub's anonymous API rate limit.
      - name: Updater can reach GitHub Releases
        continue-on-error: true
        run: ./target/release/pikcraft --check-update

      - name: Gameplay self-test
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./target/release/pikcraft --seed 42 --selftest selftest-linux && cat selftest-linux/log.txt

      - name: Package
        run: |
          mkdir -p dist/pikcraft-linux-x86_64
          cp target/release/pikcraft README.md dist/pikcraft-linux-x86_64/
          tar -C dist -czf dist/pikcraft-linux-x86_64.tar.gz pikcraft-linux-x86_64
          # The bare executable is what the in-game updater downloads.
          cp target/release/pikcraft dist/pikcraft-linux-x86_64-bin

      - uses: actions/upload-artifact@v4
        with:
          name: pikcraft-linux-x86_64
          path: |
            dist/pikcraft-linux-x86_64.tar.gz
            dist/pikcraft-linux-x86_64-bin

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-linux
          path: selftest-linux/

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Unit tests
        run: cargo test --release

      - name: Build
        run: cargo build --release

      # Hosted runners have no GPU, so use Mesa's software OpenGL for the smoke test.
      - uses: ssciwr/setup-mesa-dist-win@v2

      # Non-blocking: shared runners can hit GitHub's anonymous API rate limit.
      - name: Updater can reach GitHub Releases
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process -FilePath target\release\pikcraft.exe -ArgumentList "--check-update" -Wait -PassThru -RedirectStandardOutput update-check.txt
          Get-Content update-check.txt
          if ($p.ExitCode -ne 0) { throw "update check failed" }

      - name: Gameplay self-test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath target\release\pikcraft.exe -ArgumentList "--seed","42","--selftest","selftest-windows" -Wait -PassThru
          if (Test-Path selftest-windows\log.txt) { Get-Content selftest-windows\log.txt }
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\pikcraft-windows-x86_64 | Out-Null
          Copy-Item target\release\pikcraft.exe dist\pikcraft-windows-x86_64\PikCraft.exe
          Copy-Item README.md dist\pikcraft-windows-x86_64\
          Compress-Archive -Path dist\pikcraft-windows-x86_64\* -DestinationPath dist\pikcraft-windows-x86_64.zip
          # The bare executable is what the in-game updater downloads.
          Copy-Item target\release\pikcraft.exe dist\pikcraft-windows-x86_64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: pikcraft-windows-x86_64
          path: |
            dist/pikcraft-windows-x86_64.zip
            dist/pikcraft-windows-x86_64.exe

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-windows
          path: selftest-windows/

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pikcraft-*
          merge-multiple: true
          path: dist

      - name: Name the updater's Linux executable
        run: mv dist/pikcraft-linux-x86_64-bin dist/pikcraft-linux-x86_64

      - uses: softprops/action-gh-release@v2
        with:
          name: PikCraft ${{ inputs.release_tag || github.ref_name }}
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/pikcraft-windows-x86_64.zip
            dist/pikcraft-linux-x86_64.tar.gz
            dist/pikcraft-windows-x86_64.exe
            dist/pikcraft-linux-x86_64
          generate_release_notes: true
          body: |
            **PikCraft**: a block-world sandbox where a squad of sprouts digs, fights and carries for you.
            Recover all 5 Star Shards and bring them home to the Nest.

            ### Downloads
            * **Windows 10/11 (x64)**: `pikcraft-windows-x86_64.zip`. Unzip it and run `PikCraft.exe`.
            * **Linux (x86_64, glibc 2.34+)**: `pikcraft-linux-x86_64.tar.gz`. Extract it and run `./pikcraft`.

            Already playing v1.2.1 or later? The game finds new releases by itself: press **U** on the
            title screen or in the pause menu to install one. (The bare `.exe`/binary files are what
            the updater downloads; most players want the zip/tar.gz.)

            Press **F1** in game for controls. See the README for the full guide.
