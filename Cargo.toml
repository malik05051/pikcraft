[package]
name = "pikcraft"
version = "1.0.0"
edition = "2024"

[dependencies]
macroquad = { version = "0.4", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Keep debug builds playable: optimise dependencies and the hot simulation code.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
